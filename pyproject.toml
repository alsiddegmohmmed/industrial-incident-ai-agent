[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "industrial-incident-ai-agent"
version = "0.1.0"
description = "A software-only AI agent for investigating simulated industrial incidents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/incident_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
